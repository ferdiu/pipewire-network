# ──────────────────────────────────────────────────────────────────────────────
# pipewire-network — Package & Release workflow
#
# Triggers on any pushed tag.
#   - Tags matching *-rc<N>  (e.g. v1.2.0-rc1)  → pre-release
#   - All other tags         (e.g. v1.2.0)       → full release
#
# Package targets
#   DEB  — built on ubuntu-latest (x86_64)
#   RPM  — built inside a Fedora container on ubuntu-latest (x86_64)
# ──────────────────────────────────────────────────────────────────────────────

name: Build & Release

on:
  push:
    tags:
      - "**"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── 0. Parse the tag ───────────────────────────────────────────────────────
  prepare:
    name: "Prepare: parse tag"
    runs-on: ubuntu-latest
    outputs:
      tag:        ${{ steps.parse.outputs.tag }}
      version:    ${{ steps.parse.outputs.version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}

    steps:
      - name: Parse tag metadata
        id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          if echo "${TAG}" | grep -qE '\-rc[0-9]+$'; then
            PRERELEASE="true"
            echo "🚧  Pre-release detected: ${TAG}"
          else
            PRERELEASE="false"
            echo "✅  Full release detected: ${TAG}"
          fi
          echo "tag=${TAG}"               >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}"       >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

  # ── 1. Build DEB packages ──────────────────────────────────────────────────
  build-deb:
    name: "Build DEB (x86_64)"
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install DEB build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc \
            make \
            pkg-config \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libjson-c-dev \
            debhelper \
            dpkg-dev \
            fakeroot

      - name: Build DEB packages
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          chmod +x scripts/build-deb.sh
          ./scripts/build-deb.sh both

      - name: List built artefacts
        run: ls -lh dist/

      - name: Upload DEB artefacts
        uses: actions/upload-artifact@v4
        with:
          name: deb-packages
          path: dist/*.deb
          retention-days: 7
          if-no-files-found: error

  # ── 2. Build RPM packages ──────────────────────────────────────────────────
  build-rpm:
    name: "Build RPM (x86_64)"
    runs-on: ubuntu-latest
    needs: prepare
    container:
      image: fedora:latest

    steps:
      - name: Install RPM build dependencies
        run: |
          dnf install -y \
            gcc \
            make \
            pkgconfig \
            pipewire-devel \
            json-c-devel \
            systemd-rpm-macros \
            rpm-build \
            tar \
            findutils \
            git

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build RPM packages
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          chmod +x scripts/build-rpm.sh
          ./scripts/build-rpm.sh both

      - name: List built artefacts
        run: ls -lh dist/

      - name: Upload RPM artefacts
        uses: actions/upload-artifact@v4
        with:
          name: rpm-packages
          path: dist/*.rpm
          retention-days: 7
          if-no-files-found: error

  # ── 3. GitHub Release ──────────────────────────────────────────────────────
  release:
    name: "GitHub Release (${{ needs.prepare.outputs.tag }})"
    runs-on: ubuntu-latest
    needs: [prepare, build-deb, build-rpm]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download DEB packages
        uses: actions/download-artifact@v4
        with:
          name: deb-packages
          path: release-assets/

      - name: Download RPM packages
        uses: actions/download-artifact@v4
        with:
          name: rpm-packages
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "PipeWire Network ${{ needs.prepare.outputs.tag }}"
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          body: |
            ## PipeWire Network ${{ needs.prepare.outputs.tag }}

            ${{ needs.prepare.outputs.prerelease == 'true' && '> ⚠️ **This is a release candidate — not recommended for production use.**' || '' }}

            **Tag:**    `${{ needs.prepare.outputs.tag }}`
            **Commit:** `${{ github.sha }}`
            **Built for:** Linux x86_64

            ### Installation

            #### Fedora / RHEL / CentOS (RPM)
            ```bash
            sudo dnf install pipewire-network-receiver-*.rpm
            sudo dnf install pipewire-network-sender-*.rpm
            ```

            #### Debian / Ubuntu (DEB)
            ```bash
            sudo dpkg -i pipewire-network-receiver_*.deb
            sudo dpkg -i pipewire-network-sender_*.deb
            sudo apt-get install -f
            ```

            ### Post-install

            ```bash
            # Receiver
            systemctl --user enable --now pipewire-network-receiver.service

            # Sender
            pipewire-network-sender-config create-sample
            pipewire-network-sender-config enable default
            ```
          files: release-assets/*
          draft: false
          fail_on_unmatched_files: true
          generate_release_notes: false
